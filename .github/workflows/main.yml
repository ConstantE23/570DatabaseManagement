name: Deploy 570DatabaseManagement

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy & Build via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_SSH_IP }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # 1. Force a totally clean start to fix folder path issues
            cd ~
            rm -rf 570DatabaseProject
            
            # 2. Clone the fresh repo
            git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git 570DatabaseProject
            
            # 3. Build the Frontend
            # Absolute pathing ensures we don't get 'No such file' errors
            cd ~/570DatabaseProject/src/frontend
            npm install
            npm run build
            
            # 4. Setup the Backend
            cd ~/570DatabaseProject/src/backend
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            pip install gunicorn flask
            
            # 5. Restart PM2
            # Using the direct path to the virtual environment's gunicorn
            pm2 delete backend || true
            pm2 start "./venv/bin/gunicorn -w 4 -b 127.0.0.1:8000 backend:app" --name backend
            pm2 save
