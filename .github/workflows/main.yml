# CI validation commit
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  sanity-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repo structure
        run: ls -R

      - name: Confirm README exists
        run: |
          if [ -f README.md ]; then
            echo "README found"
          else
            echo "README missing" && exit 1
          fi
