name: Deploy 570DatabaseManagement

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy & Build via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_SSH_IP }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/570DatabaseProject || exit
            
            # 1. Sync code
            git fetch --all
            git reset --hard origin/main
            
            # 2. Build Frontend
            cd src/frontend
            npm install
            npm run build
            
            # 3. Setup Backend
            cd ../backend
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            pip install gunicorn  # Force install gunicorn just in case
            
            # 4. Force Restart PM2 using the DIRECT PATH to gunicorn
            # This prevents the "command not found" error
            pm2 delete backend || true
            pm2 start "./venv/bin/gunicorn -w 4 -b 127.0.0.1:8000 backend:app" --name backend
            pm2 save
